<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Kaushan+Script&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#000}
  #thumb{position:relative;width:1280px;height:720px;overflow:hidden;font-family:'Anton',sans-serif}
  svg.bg{position:absolute;inset:0}
  .ep{position:absolute;top:34px;left:40px;background:#ffde00;color:#111;font-family:'Bebas Neue';font-size:46px;
      padding:6px 22px 2px;transform:rotate(-4deg);box-shadow:6px 6px 0 #111;letter-spacing:2px}
  .script{position:absolute;left:52px;top:150px;font-family:'Kaushan Script';font-size:118px;color:#fff;
      transform:rotate(-6deg);text-shadow:0 0 18px #ff2fb4,0 0 40px #ff2fb4,5px 5px 0 #7a0a5a}
  .sur{position:absolute;left:96px;top:322px;font-family:'Bebas Neue';font-size:72px;color:#fff;letter-spacing:6px;
      -webkit-text-stroke:3px #111;paint-order:stroke fill;text-shadow:5px 5px 0 #111}
  .gta{position:absolute;left:210px;top:290px;font-size:250px;line-height:1;letter-spacing:4px;
      background:linear-gradient(180deg,#fff6a8 0%,#ffb13b 35%,#ff4d8d 70%,#b52bff 100%);
      -webkit-background-clip:text;background-clip:text;color:transparent;
      -webkit-text-stroke:6px #12002a;filter:drop-shadow(10px 10px 0 #12002a) drop-shadow(0 0 30px rgba(255,60,170,.8))}
  .bubble{position:absolute;right:60px;top:60px;width:190px;height:190px;border-radius:50%;
      background:radial-gradient(circle at 35% 30%,#ff5b5b,#d10000);border:8px solid #fff;box-shadow:0 0 0 6px #111,0 10px 30px rgba(0,0,0,.6);
      display:flex;align-items:center;justify-content:center;transform:rotate(10deg);
      font-family:'Anton';font-size:58px;color:#fff;text-align:center;line-height:.95;text-shadow:3px 3px 0 #111}
</style></head><body>
<div id="thumb">
<svg class="bg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0638"/><stop offset=".35" stop-color="#6b1478"/>
      <stop offset=".62" stop-color="#ff3d7f"/><stop offset=".8" stop-color="#ff9a3c"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff27a"/><stop offset=".6" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff2f7a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5f8f"/><stop offset=".3" stop-color="#5b1a7a"/><stop offset="1" stop-color="#0d0420"/>
    </linearGradient>
    <clipPath id="sunclip"><rect x="0" y="0" width="1280" height="520"/></clipPath>
    <radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".65"/></radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fff" opacity=".7">
    <circle cx="420" cy="40" r="2"/><circle cx="610" cy="90" r="1.5"/><circle cx="760" cy="30" r="2"/>
    <circle cx="300" cy="110" r="1.5"/><circle cx="990" cy="120" r="1.5"/><circle cx="860" cy="70" r="1"/>
  </g>
  <!-- sun with stripes -->
  <g clip-path="url(#sunclip)">
    <circle cx="900" cy="470" r="230" fill="url(#sun)"/>
    <g fill="#ff3d7f">
      <rect x="600" y="410" width="600" height="8"/><rect x="600" y="440" width="600" height="12"/>
      <rect x="600" y="472" width="600" height="16"/><rect x="600" y="504" width="600" height="20"/>
    </g>
  </g>
  <!-- skyline -->
  <g fill="#2a0a3f">
    <rect x="560" y="400" width="40" height="120"/><rect x="605" y="360" width="34" height="160"/>
    <rect x="645" y="420" width="50" height="100"/><rect x="700" y="330" width="28" height="190"/>
    <rect x="732" y="390" width="46" height="130"/><rect x="1060" y="380" width="40" height="140"/>
    <rect x="1105" y="340" width="30" height="180"/><rect x="1140" y="410" width="60" height="110"/>
    <rect x="1205" y="370" width="36" height="150"/><rect x="1245" y="430" width="40" height="90"/>
  </g>
  <g fill="#ffd26b" opacity=".75">
    <rect x="612" y="375" width="5" height="7"/><rect x="624" y="395" width="5" height="7"/><rect x="708" y="350" width="5" height="7"/>
    <rect x="1112" y="360" width="5" height="7"/><rect x="1122" y="400" width="5" height="7"/><rect x="1215" y="390" width="5" height="7"/>
  </g>
  <!-- sea -->
  <rect y="520" width="1280" height="200" fill="url(#sea)"/>
  <g fill="#ffb3c9" opacity=".55">
    <rect x="760" y="535" width="280" height="4"/><rect x="800" y="555" width="200" height="3"/>
    <rect x="830" y="578" width="140" height="3"/><rect x="860" y="602" width="80" height="2"/>
  </g>
  <!-- palm trees -->
  <g fill="#0b0216">
    <path d="M1185 720 C1180 600 1170 500 1140 400 L1152 398 C1185 500 1198 610 1205 720Z"/>
    <path d="M1145 400 C1090 360 1030 370 990 410 C1050 380 1100 385 1145 405Z"/>
    <path d="M1145 400 C1110 330 1060 310 1010 320 C1070 330 1110 360 1143 405Z"/>
    <path d="M1148 400 C1170 330 1220 300 1275 310 C1220 330 1185 360 1152 405Z"/>
    <path d="M1148 402 C1200 370 1260 380 1290 430 C1240 395 1195 395 1150 408Z"/>
    <path d="M1146 402 C1140 340 1150 300 1175 270 C1162 320 1158 360 1150 405Z"/>
    <path d="M1146 404 C1100 420 1075 470 1078 520 C1095 470 1115 440 1148 410Z"/>
    <path d="M30 720 C40 620 60 540 95 470 L105 476 C75 545 58 630 55 720Z"/>
    <path d="M98 472 C60 430 10 430 -20 460 C25 440 60 448 96 478Z"/>
    <path d="M98 472 C100 420 130 390 175 385 C140 405 120 435 102 478Z"/>
    <path d="M100 474 C150 450 200 465 225 505 C185 480 145 478 102 480Z"/>
    <path d="M96 474 C70 420 40 400 0 400 C40 420 70 445 94 480Z"/>
  </g>
  <!-- sports car silhouette -->
  <g transform="translate(560,600)">
    <path d="M0 70 L20 45 C60 40 110 10 170 8 C230 6 290 20 330 40 L400 48 C425 52 440 60 440 72 L440 85 L0 85Z" fill="#14031f"/>
    <path d="M120 40 C150 20 190 16 230 18 L255 40Z" fill="#ff5fa8" opacity=".55"/>
    <rect x="410" y="60" width="26" height="8" rx="3" fill="#ffef8a"/>
    <rect x="4" y="60" width="20" height="7" rx="3" fill="#ff1f4f"/>
    <circle cx="95" cy="86" r="26" fill="#05010a"/><circle cx="95" cy="86" r="11" fill="#555"/>
    <circle cx="350" cy="86" r="26" fill="#05010a"/><circle cx="350" cy="86" r="11" fill="#555"/>
    <rect x="-40" y="110" width="520" height="6" fill="#ff3d9a" opacity=".5" rx="3"/>
  </g>
  <rect width="1280" height="720" fill="url(#vig)"/>
</svg>
  <div class="ep">ÉPISODE 1</div>
  <div class="script">Mes débuts</div>
  <div class="sur">SUR</div>
  <div class="gta">GTA 6</div>
  <div class="bubble">C'EST<br>FOU&nbsp;!</div>
</div>
</body></html>
