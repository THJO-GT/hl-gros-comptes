<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Rye&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:#000}
  #thumb{position:relative;width:1280px;height:720px;overflow:hidden;font-family:'Anton',sans-serif}
  .bg{position:absolute;width:1400px;height:788px;left:-40px;top:-40px;object-fit:cover;filter:saturate(1.3) contrast(1.05)}
  .grade{position:absolute;inset:0;background:
     linear-gradient(90deg,rgba(10,0,30,.82) 0%,rgba(10,0,30,.45) 38%,rgba(10,0,30,.1) 60%,rgba(10,0,30,.55) 100%),
     radial-gradient(circle at 0% 100%,rgba(0,90,255,.55),transparent 40%),
     radial-gradient(circle at 100% 0%,rgba(255,0,40,.5),transparent 40%)}
  .poster{position:absolute;right:46px;top:42px;width:420px;height:620px;background:#efe2c2;transform:rotate(4deg);
     box-shadow:0 0 0 5px #2b1a08,16px 18px 0 rgba(0,0,0,.55);text-align:center;color:#2b1a08;
     background-image:radial-gradient(circle at 20% 15%,rgba(120,80,20,.18),transparent 45%),radial-gradient(circle at 85% 90%,rgba(120,80,20,.25),transparent 50%)}
  .pin{position:absolute;top:-10px;left:196px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ff6b6b,#a00);box-shadow:2px 3px 3px rgba(0,0,0,.5)}
  .rech{font-family:'Rye';font-size:66px;margin-top:22px;letter-spacing:2px}
  .photo{position:relative;width:370px;height:290px;margin:8px auto 0;overflow:hidden;border:5px solid #2b1a08;background:#000}
  .photo img{position:absolute;height:300px;width:511px;left:-74px;top:-6px;filter:sepia(.25) contrast(1.15) saturate(1.1)}
  .stars{font-size:52px;color:#ffcc00;-webkit-text-stroke:3px #2b1a08;letter-spacing:4px;margin-top:6px}
  .crime{font-family:'Bebas Neue';font-size:34px;line-height:1;margin-top:2px;letter-spacing:1px}
  .prime{font-family:'Rye';font-size:44px;margin-top:6px;color:#8a0f0f}
  .hud{position:absolute;left:40px;top:34px;display:flex;gap:8px}
  .hud span{font-size:58px;color:#fff;-webkit-text-stroke:4px #000;paint-order:stroke fill;text-shadow:0 0 14px rgba(255,255,255,.7)}
  .title{position:absolute;left:40px;top:150px;line-height:.88;transform:rotate(-4deg);transform-origin:left top}
  .t1{font-family:'Bebas Neue';font-size:70px;color:#fff;letter-spacing:5px;-webkit-text-stroke:4px #0a001e;paint-order:stroke fill;text-shadow:5px 5px 0 #ff2b55}
  .t2{font-size:168px;color:#fff;-webkit-text-stroke:8px #0a001e;paint-order:stroke fill;text-shadow:9px 9px 0 #0a001e,0 0 40px rgba(0,120,255,.9)}
  .t3{font-size:150px;letter-spacing:4px;
      background:linear-gradient(180deg,#fff6a8 0%,#ffb13b 40%,#ff4d8d 75%,#c13bff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
      -webkit-text-stroke:6px #0a001e;filter:drop-shadow(8px 8px 0 #0a001e) drop-shadow(0 0 22px rgba(255,61,154,.8))}
.t4{font-family:'Bebas Neue';font-size:60px;color:#fff;letter-spacing:3px;background:#e0102f;display:inline-block;padding:6px 18px 0;margin-top:14px;box-shadow:6px 6px 0 #0a001e}
</style></head><body>
<div id="thumb">
  <img class="bg" src="assets/gta6-cheetah-officiel.jpg">
  <div class="grade"></div>
  <div class="hud"><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span><span>★</span></div>
  <div class="title"><div class="t1">1ère journée et déjà…</div><div class="t2">RECHERCHÉ</div><div class="t3">GTA 6</div></div>
  <div class="poster">
    <div class="pin"></div>
    <div class="rech">RECHERCHÉ</div>
    <div class="photo"><img src="assets/photo.png"></div>
    <div class="stars">★★★★★★</div>
    <div class="crime">POUR AVOIR SEMÉ LE CHAOS<br>À VICE CITY DÈS LE 1er JOUR</div>
    <div class="prime">$1 000 000</div>
  </div>
</div>
</body></html>
