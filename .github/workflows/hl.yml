name: hl-gros-comptes
on:
  workflow_dispatch:
concurrency:
  group: hl
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TZ: Europe/Paris
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -I hl_alerts.py passage
      - name: Enregistrer l'état
        run: |
          git config user.name "hl-bot"
          git config user.email "hl-bot@users.noreply.github.com"
          git add hl_etat_positions.json hl_auto_etat.json hl_mouvements.log
          git diff --cached --quiet || (git commit -m "état $(date +%d/%m %H:%M)" && git push)
